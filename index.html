<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:linear-gradient(to bottom,#4facfe,#00c6fb);
padding:20px;
min-height:100vh;
}

.contenedor{
width:100%;
max-width:1200px;
margin:auto;
background:white;
border-radius:25px;
padding:20px;
box-shadow:0px 5px 15px rgba(0,0,0,0.3);
}

/* TITULO */

.titulo{
background:#0099ff;
padding:18px;
border-radius:18px;
margin-bottom:20px;
text-align:center;
}

.titulo h1{
color:white;
font-size:28px;
}

/* MENUS */

.menus{
display:flex;
justify-content:center;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
}

.boton-menu{
background:#00a2ff;
color:white;
text-decoration:none;
padding:12px 10px;
border-radius:12px;
width:160px;
text-align:center;
transition:0.3s;
box-shadow:0px 3px 8px rgba(0,0,0,0.2);
}

.boton-menu:hover{
background:#0066cc;
transform:scale(1.05);
}

.boton-menu h3{
font-size:13px;
}

/* IMAGEN */

.imagen-principal{
width:100%;
height:420px;
object-fit:cover;
border-radius:20px;
}

/* TABLETS */

@media(max-width:768px){

.titulo h1{
font-size:22px;
}

.boton-menu{
width:140px;
padding:10px;
}

.boton-menu h3{
font-size:12px;
}

.imagen-principal{
height:280px;
}

}

/* CELULARES */

@media(max-width:480px){

body{
padding:10px;
}

.contenedor{
padding:15px;
}

.titulo h1{
font-size:18px;
}

.menus{
gap:8px;
}

.boton-menu{
width:100%;
padding:12px;
}

.boton-menu h3{
font-size:13px;
}

.imagen-principal{
height:220px;
}

}

</style>

</head>

<body>

<div class="contenedor">

<div class="titulo">

</div>
